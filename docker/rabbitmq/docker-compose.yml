# RabbitMQ de DuocConecta (EP2): un nodo. El respaldo lo da el otro broker (SNS/SQS).
#
#   docker compose -f docker/rabbitmq/docker-compose.yml up -d
#
# Lo mismo corre en la nube, en la EC2 que crea "infra/aws.sh rabbitmq".
# Consola: http://localhost:15672
# Las credenciales vienen de variables de entorno; los valores por defecto son solo para local.
services:
  rabbitmq:
    image: rabbitmq:4.1-management
    restart: unless-stopped
    hostname: rabbit1
    container_name: duocconecta-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USUARIO:-duocconecta}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_CLAVE:-duocconecta}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 12
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # consola
    volumes:
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - datos-rabbitmq:/var/lib/rabbitmq

volumes:
  datos-rabbitmq:
