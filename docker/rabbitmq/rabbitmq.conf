# Clúster de 2 nodos de DuocConecta. Cada nodo conoce al otro por nombre: se forman solos al arrancar.
cluster_formation.peer_discovery_backend = classic_config
cluster_formation.classic_config.nodes.1 = rabbit@rabbit1
cluster_formation.classic_config.nodes.2 = rabbit@rabbit2

# Las colas quorum se replican en los dos nodos (la plataforma solo usa quorum).
default_queue_type = quorum

# Sin el usuario guest, que solo sirve desde localhost dentro del contenedor.
loopback_users = none
