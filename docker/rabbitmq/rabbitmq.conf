# RabbitMQ de DuocConecta: un nodo.

# Colas quorum aunque haya un solo nodo: son las que admiten x-delivery-limit, que manda a la DLQ
# lo que falla tres veces. Una cola clásica reintentaría para siempre.
default_queue_type = quorum

# Sin el usuario guest, que solo sirve desde localhost dentro del contenedor.
loopback_users = none
