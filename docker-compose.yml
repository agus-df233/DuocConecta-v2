# Un solo contenedor de PostgreSQL para todo el monorepo.
# Cada microservicio es dueño de su propio schema y no toca los ajenos.
services:
  postgres:
    image: postgres:16.15-alpine
    container_name: duocconecta-postgres
    environment:
      POSTGRES_DB: duocconecta
      POSTGRES_USER: ${DB_USER:-duocconecta}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-duocconecta}
      # Locale fijo para que los ORDER BY de los listados sean predecibles
      # sin importar la máquina donde se levante.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "5432:5432"
    volumes:
      - datos-postgres:/var/lib/postgresql/data
      # Ojo: este script solo se ejecuta la primera vez, cuando el volumen está vacío.
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      # Los servicios no deberían intentar conectarse antes de que la base acepte conexiones.
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-duocconecta} -d duocconecta"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  datos-postgres:
