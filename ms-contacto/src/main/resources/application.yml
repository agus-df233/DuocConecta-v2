# Configuración de ms-contacto.
# Ningún valor sensible está escrito aquí: todo viene por variable de entorno.
# Los valores por defecto son solo para levantar el entorno local con docker compose.

server:
  port: 8083

spring:
  # RabbitMQ (EP2), el segundo broker: un nodo. Credenciales por variable de entorno.
  rabbitmq:
    addresses: ${RABBITMQ_ADDRESSES:localhost:5672}
    username: ${RABBITMQ_USUARIO:duocconecta}
    password: ${RABBITMQ_CLAVE:duocconecta}
    # Corto a propósito: se publica después del commit en el mismo hilo de la petición. Con el
    # valor por defecto (60 s por dirección), un RabbitMQ caído dejaba colgada cada escritura.
    connection-timeout: 2s
    # El broker confirma cada publicación (publisher confirm); un rechazo queda en el log.
    publisher-confirm-type: correlated
    listener:
      simple:
        # Pocos mensajes a la vez: la tarea comparte CPU con otras JVM.
        prefetch: 5
        auto-startup: ${CONSUMIDORES_ACTIVOS:true}

  application:
    name: ms-contacto

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/duocconecta}
    username: ${DB_USER:duocconecta}
    password: ${DB_PASSWORD:duocconecta}

  jpa:
    hibernate:
      # Las tablas las crea Flyway. Hibernate solo verifica que el esquema coincida
      # con las entidades y falla al arrancar si no.
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: contacto
    # Se desactiva para que la sesión de base de datos no quede abierta mientras se
    # serializa la respuesta: eso esconde consultas lentas y agota el pool.
    open-in-view: false

  flyway:
    enabled: true
    schemas: contacto
    default-schema: contacto
    # En local los schemas los crea docker/postgres/init.sql, pero en RDS ese archivo
    # no se ejecuta nunca. Sin esto, ddl-auto: validate falla al arrancar en la nube.
    create-schemas: true
    locations: classpath:db/migration

  security:
    oauth2:
      resourceserver:
        jwt:
          # Emisor del tenant de Azure AD. La versión v2.0 es obligatoria:
          # con v1.0 la validación del emisor falla.
          issuer-uri: https://login.microsoftonline.com/${AZURE_TENANT_ID}/v2.0

duocconecta:
  # Mensajería (EP2). Los nombres viven solo aquí: el código no escribe ninguno a mano.
  mensajeria:
    # RabbitMQ: los mismos eventos que SNS. Topic exchange (routing key = tipo) y un DLX direct.
    rabbit:
      habilitada: ${RABBITMQ_HABILITADA:true}
      exchange: ${RABBITMQ_EXCHANGE:duocconecta.eventos}
      dlx: ${RABBITMQ_DLX:duocconecta.dlx}
      max-entregas: 3                          # a la tercera, la cola quorum lo manda al DLX
      colas:
        proyectos: duocconecta.notificaciones.proyectos
        colaboraciones: duocconecta.notificaciones.colaboraciones
        auditoria: duocconecta.auditoria
      descartes:
        proyectos: duocconecta.notificaciones.proyectos.descartes
        colaboraciones: duocconecta.notificaciones.colaboraciones.descartes
        auditoria: duocconecta.auditoria.descartes
      bindings:                                # qué tipos recibe cada cola
        proyectos: "proyecto.#"
        colaboraciones: "colaboracion.#"
        auditoria: "#"
    # En falso los eventos solo se registran en el log (tests, o trabajar sin AWS).
    habilitada: ${MENSAJERIA_HABILITADA:true}
    region: ${AWS_REGION:us-east-1}
    origen: ${spring.application.name}
    topico:
      nombre: ${SNS_TOPICO_EVENTOS:duocconecta-eventos}
      # Vacío = no se publica. Lo inyecta la task definition; en local va en .env.
      arn: ${SNS_TOPICO_EVENTOS_ARN:}

  seguridad:
    # Client-id del registro de la API en Azure AD. Es la audiencia que debe traer el token.
    audiencia: ${AZURE_CLIENT_ID}

    # Azure AD emite distintos claims según el tipo de cuenta y la configuración del tenant,
    # por eso se prueban varios en orden en vez de depender de uno solo.
    #
    # 'email' va primero a propósito. En las cuentas invitadas (B2B) el UPN tiene la forma
    # nombre_dominio.cl#EXT#@tenant.onmicrosoft.com, y el dominio real del correo institucional
    # solo aparece en 'email'. Si 'preferred_username' fuera primero, se leería el dominio del
    # tenant en vez del de Duoc y la asignación de rol quedaría mal.
    claims-correo:
      - email
      - preferred_username
      - upn
      - unique_name

    claims-nombre:
      - name
      - given_name
      - preferred_username

    # Grupos o roles que vienen en el token: App Roles de Entra ID ('roles') y grupos del user pool
    # de Cognito ('cognito:groups'). Se suman al rol del dominio, nunca lo reemplazan.
    claims-roles:
      - roles
      - cognito:groups

    # Login con Google: Cognito emite un ID token con su propio emisor y audiencia. Una entrada con
    # issuer-uri vacío se ignora, así en local sin Cognito todo funciona solo con Microsoft.
    emisores-adicionales:
      - issuer-uri: ${COGNITO_ISSUER_URI:}
        audiencia: ${COGNITO_AUDIENCIA:}
        # Entra ID no emite email_verified; Cognito sí, y sin verificar no se da rol.
        exigir-correo-verificado: true

    # Rol ADMINISTRADOR por lista (además del App Role o del grupo ADMINISTRADOR): correos separados por
    # coma. Vacía por defecto; el valor real va en .env o en la task definition, nunca aquí.
    administradores: ${ADMINISTRADORES:}
    # Cuentas externas (Google) con su rol: correo=ROL separados por coma. Fuera de la lista, 403.
    correos-permitidos: ${CORREOS_PERMITIDOS:}

    # Mapa de dominio de correo a rol. Sumar un dominio nuevo es agregar una línea aquí:
    # no hace falta tocar el código.
    dominios:
      duocuc.cl: ESTUDIANTE
      profesor.duoc.cl: PROFESOR
      duoc.cl: ACADEMICO

management:
  # Si RabbitMQ se cae, el servicio sigue sano: el otro broker y el resto de la API funcionan.
  health:
    rabbit:
      enabled: false
  endpoints:
    web:
      exposure:
        # Solo se expone health. El resto de los endpoints de Actuator dan información
        # interna que no tiene por qué salir del servicio.
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    # Ordena los endpoints por método para que la documentación se lea siempre igual.
    operationsSorter: method

logging:
  level:
    # Se sube a DEBUG en la nube con la variable LOG_NIVEL, sin reconstruir la imagen.
    cl.duoc.duocconecta: ${LOG_NIVEL:INFO}
  pattern:
    # El identificador de correlación va en cada línea: es lo que permite seguir una misma
    # petición entre el BFF y los microservicios en un solo grupo de CloudWatch.
    level: "%5p [%X{idPeticion:-sin-id}]"

---
# Perfil de desarrollo: solo sube el detalle de los registros.
# No hay datos de ejemplo: las solicitudes las crea la gente al usar la aplicación.
spring:
  config:
    activate:
      on-profile: dev

logging:
  level:
    cl.duoc.duocconecta: DEBUG
