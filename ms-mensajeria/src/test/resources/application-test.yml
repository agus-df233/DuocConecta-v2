# Tests de ms-mensajeria: sin internet y sin AWS (los clientes se reemplazan por dobles).

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ""
          jwk-set-uri: http://localhost:0/.well-known/jwks.json

duocconecta:
  seguridad:
    audiencia: audiencia-de-prueba
    dominios:
      duocuc.cl: ESTUDIANTE
      profesor.duoc.cl: PROFESOR
      duoc.cl: ACADEMICO

# RabbitMQ apagado en los tests: no hace falta un broker para que el contexto levante.
---
spring:
  rabbitmq:
    listener:
      simple:
        auto-startup: false
duocconecta:
  mensajeria:
    rabbit:
      habilitada: false
